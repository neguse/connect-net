syntax = "proto3";
package validation_test;
option csharp_namespace = "ConnectNet.Tests.Proto";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";

// --- String rules ---
message StringTestMessage {
  string name = 1 [(buf.validate.field).string.min_len = 3];
  string email = 2 [(buf.validate.field).string.email = true];
  string code = 3 [(buf.validate.field).string = {min_len: 2, max_len: 10}];
  string prefix_val = 4 [(buf.validate.field).string.prefix = "pre_"];
  string pattern_val = 5 [(buf.validate.field).string.pattern = "^[a-z]+$"];
}

// --- Numeric rules ---
message NumericTestMessage {
  int32 age = 1 [(buf.validate.field).int32.gte = 0, (buf.validate.field).int32.lte = 150];
  double score = 2 [(buf.validate.field).double.gte = 0.0, (buf.validate.field).double.lte = 100.0];
  uint64 count = 3 [(buf.validate.field).uint64.gt = 0];
}

// --- Bool rules ---
message BoolTestMessage {
  bool must_be_true = 1 [(buf.validate.field).bool.const = true];
}

// --- Enum rules ---
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
}

message EnumTestMessage {
  Status status = 1 [(buf.validate.field).enum.defined_only = true];
}

// --- Repeated rules ---
message RepeatedTestMessage {
  repeated string tags = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 5}];
  repeated int32 scores = 2 [(buf.validate.field).repeated.unique = true];
}

// --- Map rules ---
message MapTestMessage {
  map<string, string> labels = 1 [(buf.validate.field).map = {min_pairs: 1, max_pairs: 10}];
}

// --- Message / nested ---
message NestedTestMessage {
  StringTestMessage inner = 1 [(buf.validate.field).required = true];
  repeated StringTestMessage items = 2;
}

// --- Oneof rules ---
message OneofTestMessage {
  oneof contact {
    option (buf.validate.oneof).required = true;
    string email = 1;
    string phone = 2;
  }
}

// --- Well-known types ---
message TimestampTestMessage {
  google.protobuf.Timestamp created_at = 1 [(buf.validate.field).required = true];
}

message DurationTestMessage {
  google.protobuf.Duration timeout = 1 [(buf.validate.field).required = true];
}

// --- Repeated with items rules ---
message RepeatedItemsTestMessage {
  repeated string values = 1 [(buf.validate.field).repeated.items = {
    string: { min_len: 3 }
  }];
}

// --- Map with keys/values rules ---
message MapKeysValuesTestMessage {
  map<string, string> entries = 1 [(buf.validate.field).map = {
    keys: { string: { min_len: 2 } },
    values: { string: { min_len: 3 } }
  }];
}

// --- Enum const ---
message EnumConstTestMessage {
  Status status = 1 [(buf.validate.field).enum.const = 1];
}

// --- Disabled / ignore field ---
message DisabledFieldMessage {
  string name = 1 [(buf.validate.field).string.min_len = 3];
  string skip_me = 2 [(buf.validate.field) = {ignore: IGNORE_ALWAYS, string: {min_len: 5}}];
}

// --- Presence semantics (proto3 optional / oneof members) ---
message PresenceTestMessage {
  optional string opt_name = 1 [(buf.validate.field).string.min_len = 3];
  oneof choice {
    string choice_a = 2 [(buf.validate.field).string.min_len = 3];
    int32 choice_b = 3 [(buf.validate.field).int32.gt = 10];
  }
}

// --- Required semantics ---
message RequiredTestMessage {
  optional string opt_required = 1 [(buf.validate.field).required = true];
  string implicit_required = 2 [(buf.validate.field).required = true];
  repeated string list_required = 3 [(buf.validate.field).required = true];
  int32 num_required = 4 [(buf.validate.field).required = true];
}

// --- Recursion into map message values ---
message NestedMapTestMessage {
  map<string, StringTestMessage> entries = 1;
}

// --- Reversed range (OR semantics), NaN, finite ---
message RangeTestMessage {
  int32 outside = 1 [(buf.validate.field).int32 = {gt: 10, lt: 5}];
  int32 inside = 2 [(buf.validate.field).int32 = {gte: 5, lte: 10}];
  float float_lt = 3 [(buf.validate.field).float.lt = 10];
  double double_gte = 4 [(buf.validate.field).double.gte = 0];
  float float_finite = 5 [(buf.validate.field).float.finite = true];
  double double_finite = 6 [(buf.validate.field).double.finite = true];
  float float_in = 7 [(buf.validate.field).float = {in: [0, 1.5]}];
  float float_const = 8 [(buf.validate.field).float.const = 0];
}

// --- String length semantics (code points / bytes) ---
message StringLenTestMessage {
  string len_val = 1 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.len = 3];
  string max_len_val = 2 [(buf.validate.field).string.max_len = 3];
  string len_bytes_val = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.len_bytes = 3];
  string min_bytes_val = 4 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.min_bytes = 3];
  string max_bytes_val = 5 [(buf.validate.field).string.max_bytes = 6];
}

// --- String well-known formats ---
message StringFormatTestMessage {
  string email = 1 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.email = true];
  string hostname = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.hostname = true];
  string ip = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.ip = true];
  string ipv4 = 4 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.ipv4 = true];
  string ipv6 = 5 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.ipv6 = true];
  string uri = 6 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.uri = true];
  string uri_ref = 7 [(buf.validate.field).string.uri_ref = true];
  string uuid = 8 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.uuid = true];
  string tuuid = 9 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.tuuid = true];
}

// --- Timestamp / Duration rules ---
message WktRulesTestMessage {
  google.protobuf.Timestamp const_ts = 1 [(buf.validate.field).timestamp.const = {seconds: 1000}];
  google.protobuf.Timestamp lt_now_ts = 2 [(buf.validate.field).timestamp.lt_now = true];
  google.protobuf.Timestamp gt_now_ts = 3 [(buf.validate.field).timestamp.gt_now = true];
  google.protobuf.Timestamp within_ts = 4 [(buf.validate.field).timestamp.within = {seconds: 3600}];
  google.protobuf.Timestamp range_ts = 5 [(buf.validate.field).timestamp = {gt: {seconds: 1000}, lt: {seconds: 500}}];
  google.protobuf.Duration const_dur = 6 [(buf.validate.field).duration.const = {seconds: 5}];
  google.protobuf.Duration in_dur = 7 [(buf.validate.field).duration = {in: [{seconds: 1}, {seconds: 2}]}];
  google.protobuf.Duration not_in_dur = 8 [(buf.validate.field).duration = {not_in: [{seconds: 3}]}];
  google.protobuf.Duration range_dur = 9 [(buf.validate.field).duration = {gt: {seconds: 10}, lt: {seconds: 5}}];
}

// --- Wrapper types ---
message WrapperTestMessage {
  google.protobuf.StringValue name = 1 [(buf.validate.field).string.min_len = 3];
  google.protobuf.Int32Value num = 2 [(buf.validate.field).int32.gt = 10];
  google.protobuf.BoolValue flag = 3 [(buf.validate.field).bool.const = true];
  google.protobuf.DoubleValue score = 4 [(buf.validate.field).double.lt = 100];
}

// --- Bytes pattern/prefix/suffix/contains ---
message BytesExtraTestMessage {
  bytes prefix_val = 1 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).bytes.prefix = "\x01\x02"];
  bytes suffix_val = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).bytes.suffix = "\xff"];
  bytes contains_val = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).bytes.contains = "abc"];
  bytes pattern_val = 4 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).bytes.pattern = "^[a-z]+$"];
}

// --- Enum defined_only inside repeated / map ---
message CollectionEnumTestMessage {
  repeated Status statuses = 1 [(buf.validate.field).repeated.items = {enum: {defined_only: true}}];
  map<int32, Status> status_map = 2 [(buf.validate.field).map = {values: {enum: {defined_only: true}}}];
}

// --- IGNORE_IF_ZERO_VALUE on repeated / map ---
message IgnoreZeroCollectionsMessage {
  repeated string tags = 1 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).repeated.min_items = 2];
  map<string, string> labels = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).map.min_pairs = 2];
}

// --- repeated.unique with NaN ---
message UniqueFloatTestMessage {
  repeated float float_values = 1 [(buf.validate.field).repeated.unique = true];
  repeated double double_values = 2 [(buf.validate.field).repeated.unique = true];
}

// --- Unsupported rules (must fail loud) ---
message UnsupportedFieldCelMessage {
  string name = 1 [(buf.validate.field).cel = {id: "x", message: "m", expression: "true"}];
}

message UnsupportedMessageCelMessage {
  option (buf.validate.message).cel = {id: "x", message: "m", expression: "true"};
  string name = 1;
}

message UnsupportedStringFormatMessage {
  string addr = 1 [(buf.validate.field).string.address = true];
}

message UnsupportedAnyMessage {
  google.protobuf.Any value = 1 [(buf.validate.field).any = {in: ["type.googleapis.com/foo"]}];
}

message UnsupportedFieldMaskMessage {
  google.protobuf.FieldMask mask = 1 [(buf.validate.field).field_mask = {not_in: ["secret"]}];
}

message UnsupportedNestedItemsMessage {
  repeated string ids = 1 [(buf.validate.field).repeated.items = {string: {ulid: true}}];
}

// --- Custom CEL rules ---
message CelFieldTestMessage {
  int32 a = 1 [(buf.validate.field).cel = {id: "a.positive", message: "a must be positive", expression: "this > 0"}];
  string b = 2 [(buf.validate.field).cel = {id: "b.nonempty", expression: "this.size() > 0 ? '' : 'b must not be empty'"}];
  repeated int32 items = 3 [(buf.validate.field).repeated.items = {
    cel: {id: "item.even", message: "item must be even", expression: "this % 2 == 0"}
  }];
  map<string, int32> counts = 4 [(buf.validate.field).map = {
    keys: {cel: {id: "key.lower", message: "key must be lowercase", expression: "this == this.lowerAscii()"}},
    values: {cel: {id: "value.nonneg", message: "value must be non-negative", expression: "this >= 0"}}
  }];
  google.protobuf.Timestamp when = 5 [(buf.validate.field).cel = {id: "when.past", message: "must be in the past", expression: "this < now"}];
  int32 shorthand = 6 [(buf.validate.field).cel_expression = "this != 13"];
  string pattern = 7 [(buf.validate.field).cel = {id: "pattern.emoji", message: "must be three characters", expression: "this.matches('^.{3}$')"}];
}

message CelMessageTestMessage {
  option (buf.validate.message).cel = {id: "range", message: "min must not exceed max", expression: "this.min <= this.max"};
  option (buf.validate.message).cel_expression = "this.min >= 0";
  int32 min = 1;
  int32 max = 2;
}

message MessageOneofTestMessage {
  option (buf.validate.message).oneof = {fields: ["a", "b"], required: true};
  string a = 1 [(buf.validate.field).string.min_len = 2];
  string b = 2;
}

message RecursiveTestMessage {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  RecursiveTestMessage child = 2;
  repeated RecursiveTestMessage children = 3;
}

message MismatchedRuleTestMessage {
  string val = 1 [(buf.validate.field).int32.gt = 1];
}

message BadExpressionTestMessage {
  string val = 1 [(buf.validate.field).cel = {id: "bad", expression: "this.nope() +"}];
}

message NonBoolExpressionTestMessage {
  string val = 1 [(buf.validate.field).cel = {id: "int", expression: "1 + 1"}];
}

message DynRuntimeErrorTestMessage {
  option (buf.validate.message).cel = {id: "dyn", expression: "dyn(this.a) + 'str' == 'x'"};
  int32 a = 1;
}

message ExpensiveTestMessage {
  repeated int32 values = 1 [(buf.validate.field).cel = {id: "expensive", expression: "this.all(x, this.all(y, x + y >= 0))"}];
}

message NestedCelTestMessage {
  CelFieldTestMessage inner = 1;
  map<string, CelFieldTestMessage> by_name = 2;
}

// --- Limits ---
message LimitsTestMessage {
  // Output construction: a rule whose intermediate values grow quadratically.
  repeated int32 values = 1 [(buf.validate.field).cel = {
    id: "values.product"
    expression: "this.map(x, this.map(y, x * y)).size() >= 0"
  }];
  // Diagnostic allocation: a rule message that echoes the (attacker-sized) value.
  string text = 2 [(buf.validate.field).cel = {
    id: "text.echo"
    expression: "this == '' ? '' : 'bad value: %s'.format([this])"
  }];
  repeated LimitsTestMessage children = 3;
  int32 n = 4 [(buf.validate.field).int32.gte = 0];
}

message DeepExpressionTestMessage {
  int32 val = 1 [(buf.validate.field).cel = {id: "deep", expression: "((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((this > 0))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))"}];
}

